<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gih Rogenski Presentes</title>
<style>
:root{--t:#16b8b0;--td:#078d87;--k:#111;--c:#f8f5ef;--w:#fff;--m:#777;--l:rgba(17,17,17,.08);--s:0 14px 40px rgba(17,17,17,.08)}

*{box-sizing:border-box}
body{margin:0;background:var(--c);color:var(--k);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
a{text-decoration:none;color:inherit}

.top{height:76px;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100% - 1120px)/2))}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:44px;height:44px;border:2px solid #111;border-radius:50%;display:grid;place-items:center;font:700 16px Georgia,serif}
.brand b{display:block;font:700 19px Georgia,serif}
.brand small{display:block;font-size:8px;font-weight:800;letter-spacing:3px;margin-top:2px}
.contact{background:var(--k);color:#fff;border-radius:999px;padding:11px 17px;font-size:12px;font-weight:800}

.hero{background:#fff;position:relative;overflow:hidden;border-bottom:1px solid var(--l)}
.hero:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-160px;top:-230px;background:rgba(22,184,176,.13)}
.hero-in{width:min(1120px,calc(100% - 36px));margin:auto;padding:70px 0 75px;position:relative;z-index:1}

.tag{display:inline-block;background:var(--t);color:#fff;border-radius:999px;padding:9px 14px;font-size:10px;font-weight:900;letter-spacing:1.5px}
h1{font:500 clamp(42px,7vw,72px)/.98 Georgia,serif;margin:18px 0 16px;max-width:700px}
h1 em{color:var(--td);font-style:normal}
.hero p{max-width:560px;color:var(--m);font-size:16px;line-height:1.6;margin:0}

.wrap{width:min(1120px,calc(100% - 36px));margin:auto;padding:55px 0 75px}
.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}
.heading span{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--td)}
.heading h2{font:500 34px Georgia,serif;margin:7px 0 0}
.heading p{color:var(--m);font-size:12px}

.products{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border:1px solid var(--l);border-radius:25px;overflow:hidden;box-shadow:var(--s);transition:.2s transform,.2s box-shadow}
.card:hover{transform:translateY(-5px);box-shadow:0 20px 55px rgba(17,17,17,.13)}

/* CORREÇÃO: a área da imagem não é mais quadrada */
.photo{position:relative;background:#eee;overflow:hidden}
.photo img{width:100%;height:auto;display:block}
.photo span{position:absolute;z-index:2;left:14px;top:14px;background:#111;color:#fff;padding:8px 10px;border-radius:999px;font-size:10px;font-weight:900;letter-spacing:.7px}

/* Informações/botão continuam disponíveis para outros cards */
.info{padding:20px}
.info small{font-size:9px;font-weight:900;letter-spacing:2px;color:var(--td)}
.info h3{font:500 21px/1.15 Georgia,serif;margin:8px 0 13px;min-height:49px}
.old{font-size:12px;color:#999;text-decoration:line-through}
.price{font-size:28px;font-weight:900;margin-top:3px}
.buy{margin-top:17px;background:var(--t);color:#fff;border-radius:13px;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;font-size:11px;font-weight:900;letter-spacing:.8px}
.buy b{font-size:18px}

.about{margin-top:55px;padding:30px;border-radius:26px;background:#111;color:#fff;display:flex;align-items:center;gap:20px}
.about .logo{border-color:#fff;flex:0 0 auto}
.about span{font-size:10px;font-weight:900;letter-spacing:2px;color:#65ddd7}
.about h2{font:500 28px Georgia,serif;margin:7px 0}
.about p{color:rgba(255,255,255,.7);font-size:13px;line-height:1.5;margin:0;max-width:700px}

footer{text-align:center;background:#fff;border-top:1px solid var(--l);padding:30px 20px 38px;font-size:12px}
footer p{margin:9px 0 0;color:var(--m);font-size:11px}

@media(max-width:800px){
  .products{grid-template-columns:repeat(2,1fr)}
  .heading{align-items:start;flex-direction:column}
}
@media(max-width:520px){
  .top{height:68px}
  .contact{padding:9px 12px}
  .hero-in{padding:52px 0 58px}
  .wrap{padding-top:40px}
  .products{grid-template-columns:1fr 1fr;gap:12px}
  .info{padding:14px}
  .info h3{font-size:17px;min-height:42px}
  .price{font-size:22px}
  .buy{padding:11px 12px}
  .about{padding:24px;align-items:flex-start}
}
.contact{
    background:#111;
    color:#fff;
    border:1px solid #25D366;
    border-radius:999px;
    padding:10px 17px;
    font-size:12px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
}

.contact i{
    color:#25D366;
    font-size:19px;
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">GR</div>
    <div>
      <b>Gih Rogenski</b>
      <small>PRESENTES</small>
    </div>
  </div>

  <a class="contact"
   href="https://wa.me/5514998792917"
   target="_blank"
   rel="noopener">
   <i class="fa-brands fa-whatsapp"></i>
   Fale comigo
</a>
</header>

<section class="hero">
  <div class="hero-in">
    <span class="tag">✨ OFERTAS SELECIONADAS</span>
    <h1>Achadinhos que<br><em>valem a pena</em></h1>
    <p>Confira minhas promoções favoritas e aproveite.</p>
  </div>
</section>

<main>
  <section class="wrap">
    <div class="heading">
      <div>
        <span>OFERTAS ESPECIAIS</span>
        <h2>Ofertas Relâmpago</h2>
      </div>
    </div>

    <section class="products">

    <article class="card">
      <a href="COLE_AQUI_SEU_LINK_DE_AFILIADA" target="_blank" rel="noopener sponsored">
        <div class="photo">
          <img src="1.png" alt="Produto em promoção">
        </div>
      </a>
    </article>

    
  </section>

  </section>
</main>


<footer>
  Gih Rogenski Presentes
  <p>2026</p>
</footer>

</body>
</html>
